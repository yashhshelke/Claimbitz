# Template — fill with base64-encoded values before applying.
# In production, use a secrets manager (AWS Secrets Manager, Vault, etc.)
# via ExternalSecrets or sealed-secrets instead of this file.
apiVersion: v1
kind: Secret
metadata:
  name: claimblitz-secrets
  namespace: claimblitz
type: Opaque
data:
  postgres-dsn: ""      # base64 of postgresql+asyncpg://...
  redis-url: ""         # base64 of redis://...
  rabbitmq-url: ""      # base64 of amqp://...
  gemini-api-key: ""    # base64 of your Gemini API key
  pinecone-api-key: ""  # base64 of your Pinecone API key
  jwt-secret-key: ""    # base64 of a strong random secret
  sentry-dsn: ""        # base64 of Sentry DSN (optional)
